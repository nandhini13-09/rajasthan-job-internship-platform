<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Post opportunity</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="fragments :: nav"></div><main class="auth-wrap"><form class="form-card wide" method="post" action="/company/job/new"><span class="eyebrow">EMPLOYER SPACE</span><h1>Post an opportunity</h1><label>Job / Internship title</label><input name="title" required><label>Type</label><select name="jobType"><option value="JOB">Full-time job</option><option value="INTERNSHIP">Internship</option></select><label>Description</label><textarea name="description" rows="4" required></textarea><label>Required skills (comma separated)</label><input name="requiredSkills" placeholder="Java, SQL, Spring Boot" required><label>Location</label><input name="location" placeholder="Jaipur / Remote" required><label>Minimum CGPA (optional)</label><input name="minimumCgpa" type="number" min="0" max="10" step="0.01"><button class="btn full">Publish opportunity</button></form></main></body></html>
