<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Register</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="fragments :: nav"></div><main class="auth-wrap"><form class="form-card wide" method="post" action="/register"><span class="eyebrow">JOIN CAREERCONNECT</span><h1>Create your account</h1><p class="error" th:text="${error}"></p><label>Full name / Contact person</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" minlength="6" required><label>Account type</label><select name="role" id="role" onchange="toggleFields()" required><option value="STUDENT">Student</option><option value="COMPANY">Company</option></select><div id="studentFields"><label>College</label><input name="college"><label>Department</label><input name="department" placeholder="Information Technology"><label>Skills (comma separated)</label><input name="skills" placeholder="Java, SQL, HTML"><label>CGPA</label><input name="cgpa" type="number" min="0" max="10" step="0.01"></div><div id="companyFields" style="display:none"><label>Company name</label><input name="companyName"></div><button class="btn full">Create account</button><p>Already registered? <a href="/login">Login</a></p></form></main><script>function toggleFields(){let s=document.getElementById('role').value==='STUDENT';document.getElementById('studentFields').style.display=s?'block':'none';document.getElementById('companyFields').style.display=s?'none':'block';}</script></body></html>
