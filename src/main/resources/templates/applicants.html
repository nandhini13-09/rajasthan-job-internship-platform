<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Applicants</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="fragments :: nav"></div><main class="container dashboard"><span class="eyebrow">EMPLOYER SPACE</span><h1>Applicants for <span th:text="${job.title}"></span></h1><article class="job-card" th:each="row : ${rows}"><h3 th:text="${row.student.name}"></h3><p th:text="${row.student.email}"></p><p th:text="'College: '+${row.student.college}+' | Department: '+${row.student.department}"></p><p th:text="'Skills: '+${row.student.skills}+' | CGPA: '+${row.student.cgpa}"></p><p th:text="'Current status: '+${row.app.status}"></p><form th:action="@{'/applications/'+${row.app.id}+'/status'}" method="post" class="inline"><select name="status"><option value="SHORTLISTED">Shortlist</option><option value="SELECTED">Select</option><option value="REJECTED">Reject</option></select><button class="btn small">Update status</button></form></article><p th:if="${#lists.isEmpty(rows)}">No applications received yet.</p></main></body></html>
